name: token-finops budget check
description: >-
  Compare an already-exported token-finops usage payload (self-audit --json or
  report --json) against a configured USD budget and comment on the PR;
  optionally fail the job if the budget is exceeded.
author: burn-token-burn
branding:
  icon: alert-triangle
  color: orange

inputs:
  usage-json-path:
    description: >-
      Path to a JSON file produced by `token-finops self-audit --json` or
      `token-finops report --json`. This file must already exist in the
      workspace when this action runs — e.g. checked out from the PR branch,
      downloaded from a build artifact with actions/download-artifact, or
      pasted into the PR description and extracted by an earlier step (see
      README.md for the PR-template convention). This action never scans
      `~/.claude`, `~/.copilot`, etc. itself; that telemetry only exists on
      the machine where the coding session ran, not on the runner.
    required: true
  budget-usd:
    description: Budget threshold in USD. Usage above this is reported as over-budget.
    required: true
  fail-on-exceed:
    description: >-
      If "true", fail the job (exit 1) when usage exceeds budget-usd. Default
      is "false" (comment only) because this is an estimate, not a metered
      bill, and a hard merge-block on an estimate is a strong claim -- teams
      that want a hard gate should opt in explicitly.
    required: false
    default: "false"
  comment-on-pr:
    description: If "true" and running on a pull_request event, post/update a PR comment with the result.
    required: false
    default: "true"
  github-token:
    description: Token used to post the PR comment. Defaults to the workflow's own GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}

outputs:
  over-budget:
    description: "'true' or 'false'"
    value: ${{ steps.check.outputs.over-budget }}
  total-usd:
    description: Computed total usage in USD
    value: ${{ steps.check.outputs.total-usd }}
  budget-usd:
    description: Echo of the configured budget in USD
    value: ${{ steps.check.outputs.budget-usd }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      run: |
        python3 "${{ github.action_path }}/check_budget.py" \
          --usage-json "${{ inputs.usage-json-path }}" \
          --budget-usd "${{ inputs.budget-usd }}"

    - name: Comment on PR
      if: |
        always() && steps.check.outcome == 'success' &&
        inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = "<!-- token-finops-budget-check -->";
          const body = `${{ steps.check.outputs.summary }}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
          const existing = comments.data.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce budget
      if: steps.check.outputs.over-budget == 'true' && inputs.fail-on-exceed == 'true'
      shell: bash
      run: |
        echo "::error::token-finops budget check: usage \$${{ steps.check.outputs.total-usd }} exceeds budget \$${{ steps.check.outputs.budget-usd }}"
        exit 1
