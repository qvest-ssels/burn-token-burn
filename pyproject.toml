[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-finops"
version = "0.1.0"
description = "Read-only, local-first token usage and budget-runway tracker for AI coding agents (Copilot CLI, Claude Code, Codex CLI, Gemini CLI, Hermes Agent) plus a local-vs-cloud savings estimator"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Qvest Digital" }, { name = "tronicum" }]
keywords = ["finops", "token-usage", "copilot", "claude-code", "codex", "gemini-cli", "hermes-agent", "cli", "local-llm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/tronicum/burn-token-burn"
Origin = "https://github.com/oh-my-agent-code/token-finops-cli"

[project.scripts]
token-finops = "token_finops:main"

[tool.hatch.build.targets.wheel]
packages = ["src/token_finops"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
